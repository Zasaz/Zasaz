name: snake

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#6b4a32&color_dots=#f3e5c8,#e8c48a,#d9a05b,#c2752f,#8a4b14
            dist/github-snake-dark.svg?color_snake=#c79a6b&color_dots=#1f1a24,#5c3d1e,#9a5b23,#d9822b,#ffb347
      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
